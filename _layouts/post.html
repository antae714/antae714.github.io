---
layout: default
---



<article class="post">
	<div class="Paragraph" style="overflow: hidden;">
		<div id="{{ page.title | slugify }}" class="post-title">{{ page.title }}</div>
		<!--
	<div class="post-description"> {{ page.description }}</div>
		-->
		{% if page.AutoContents %}
		<ol class="subtitle-list">
			{% for item in page.subtitle %}
			<a class="Link" href="#{{ item | slugify }}"><li>{{ item }}</li></a>
			{% endfor %}
		</ol>
		{% endif %}
		<br />
		{% if page.TitleVideo %}
		<video controls autoplay muted loop playsinline preload="metadata" style="width:100%;height:auto;">
			<source src="{{ page.TitleVideo | relative_url }}" type="video/mp4">
		</video>
		{% endif %}

	</div>

	{{ content }}
</article>

{% include Post.html %}
